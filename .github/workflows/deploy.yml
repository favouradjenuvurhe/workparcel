name: Deploy Workparcel to WordPress.org

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to deploy"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Workparcel
    runs-on: ubuntu-latest

    steps:
      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version: $VERSION"
            echo "Expected format: 1.0.0"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying Workparcel version: $VERSION"

      - name: Checkout plugin source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          if [[ -z "$SVN_USERNAME" ]]; then
            echo "ERROR: WP_SVN_USERNAME secret is missing."
            exit 1
          fi

          if [[ -z "$SVN_PASSWORD" ]]; then
            echo "ERROR: WP_SVN_PASSWORD secret is missing."
            exit 1
          fi

          svn checkout \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert \
            https://plugins.svn.wordpress.org/workparcel \
            wordpress-svn

      - name: Prepare SVN directories
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p wordpress-svn/trunk
          mkdir -p wordpress-svn/tags

          rm -rf wordpress-svn/trunk/*

          if [[ -d "wordpress-svn/tags/$VERSION" ]]; then
            echo "Version $VERSION already exists in WordPress.org SVN."
            echo "Refusing to overwrite an existing release tag."
            exit 1
          fi

          mkdir -p "wordpress-svn/tags/$VERSION"

      - name: Copy plugin to SVN
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='wordpress-svn/' \
            ./ wordpress-svn/trunk/

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='wordpress-svn/' \
            ./ "wordpress-svn/tags/$VERSION/"

      - name: Validate plugin files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [[ ! -f "wordpress-svn/trunk/readme.txt" ]]; then
            echo "ERROR: readme.txt is missing."
            exit 1
          fi

          if ! grep -Eq \
            "^[[:space:]]*Stable tag:[[:space:]]*$VERSION[[:space:]]*$" \
            "wordpress-svn/trunk/readme.txt"
          then
            echo "ERROR: readme.txt Stable tag does not match $VERSION"
            exit 1
          fi

          echo "Plugin validation passed."

      - name: Show SVN changes
        run: |
          cd wordpress-svn
          svn status

      - name: Commit to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd wordpress-svn

          svn add --force trunk "tags/$VERSION"

          svn commit \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert \
            -m "Release Workparcel $VERSION"

          echo "Successfully deployed Workparcel $VERSION to WordPress.org SVN."
