name: Deploy Workparcel to WordPress.org

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Workparcel ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Checkout released code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Get release version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Use a tag such as v1.0.0"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Checkout WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          svn checkout \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert \
            https://plugins.svn.wordpress.org/workparcel \
            wordpress-svn

      - name: Prepare plugin release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          rm -rf wordpress-svn/trunk/*
          mkdir -p "wordpress-svn/tags/$VERSION"

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='wordpress-svn/' \
            ./ wordpress-svn/trunk/

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='wordpress-svn/' \
            ./ "wordpress-svn/tags/$VERSION/"

      - name: Validate readme.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [[ ! -f wordpress-svn/trunk/readme.txt ]]; then
            echo "ERROR: readme.txt is missing."
            exit 1
          fi

          if ! grep -Eq \
            "^[[:space:]]*Stable tag:[[:space:]]*$VERSION[[:space:]]*$" \
            wordpress-svn/trunk/readme.txt
          then
            echo "ERROR: Stable tag does not match $VERSION"
            exit 1
          fi

      - name: Show SVN changes
        run: |
          cd wordpress-svn
          svn status 

      - name: Commit to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd wordpress-svn

          svn add --force trunk "tags/$VERSION"

          svn commit \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert \
            -m "Release Workparcel $VERSION"
